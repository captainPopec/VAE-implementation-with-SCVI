# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-implementation-with-scvi"
version = "0.1.0"
description = "Implementation of Variational Autoencoders (VAE) with scVI for single-cell transcriptomics analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
{ name = "Your Name" }
]
keywords = [
"vae",
"scvi",
"single-cell",
"deep-learning",
"bioinformatics",
"pytorch"
]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Science/Research",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Topic :: Scientific/Engineering :: Bio-Informatics",
"Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
"numpy>=1.24",
"pandas>=2.0",
"scipy>=1.10",
"matplotlib>=3.7",
"seaborn>=0.12",
"torch>=2.1",
"torchvision>=0.16",
"scanpy>=1.10",
"anndata>=0.10",
"scvi-tools>=1.1",
"scikit-learn>=1.3",
"jupyter>=1.0",
"tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
"black>=24.0",
"ruff>=0.5",
"pytest>=8.0",
"mypy>=1.10"
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
